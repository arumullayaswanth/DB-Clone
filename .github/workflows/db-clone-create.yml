# =============================================================
# DB Clone - Create
# =============================================================
# Triggered when a PR modifies db-clone/config.yaml
# Requires manual approval via the "db-approval" environment
# Supports two backend strategies:
#   - aurora-cluster: copy-on-write clone (fast, cheap)
#   - rds-instance: snapshot + restore (any RDS engine)
# =============================================================

name: "DB Clone - Create"

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "db-clone/config.yaml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  create-clone:
    runs-on: ubuntu-latest
    environment: db-approval # Requires manual approval from SRE/Approver

    steps:
      # -------------------------------------------
      # 1. Parse Config
      # -------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Config
        id: config
        run: |
          CONFIG_FILE="db-clone/config.yaml"

          REGION=$(grep '^region:' "$CONFIG_FILE" | awk '{print $2}')
          SOURCE_DB=$(grep '^source_db:' "$CONFIG_FILE" | awk '{print $2}')
          SOURCE_TYPE=$(grep '^source_type:' "$CONFIG_FILE" | awk '{print $2}')
          TTL_HOURS=$(grep '^ttl_hours:' "$CONFIG_FILE" | awk '{print $2}')
          INSTANCE_CLASS=$(grep '^instance_class:' "$CONFIG_FILE" | awk '{print $2}')

          # Defaults
          if [ -z "$INSTANCE_CLASS" ]; then
            INSTANCE_CLASS="db.r5.large"
          fi
          if [ -z "$SOURCE_TYPE" ]; then
            SOURCE_TYPE="aurora-cluster"
          fi

          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "source_db=$SOURCE_DB" >> $GITHUB_OUTPUT
          echo "source_type=$SOURCE_TYPE" >> $GITHUB_OUTPUT
          echo "ttl_hours=$TTL_HOURS" >> $GITHUB_OUTPUT
          echo "instance_class=$INSTANCE_CLASS" >> $GITHUB_OUTPUT

          echo "Parsed Config:"
          echo "  Region: $REGION"
          echo "  Source DB: $SOURCE_DB"
          echo "  Source Type: $SOURCE_TYPE"
          echo "  TTL Hours: $TTL_HOURS"
          echo "  Instance Class: $INSTANCE_CLASS"

      # -------------------------------------------
      # 2. Validate Inputs
      # -------------------------------------------
      - name: Validate Inputs
        run: |
          REGION="${{ steps.config.outputs.region }}"
          SOURCE_DB="${{ steps.config.outputs.source_db }}"
          SOURCE_TYPE="${{ steps.config.outputs.source_type }}"
          TTL_HOURS="${{ steps.config.outputs.ttl_hours }}"

          # Check fields exist
          if [ -z "$REGION" ] || [ -z "$SOURCE_DB" ] || [ -z "$TTL_HOURS" ]; then
            echo "ERROR: Missing required fields in config.yaml"
            echo "Required: region, source_db, ttl_hours"
            exit 1
          fi

          # Validate source_type
          if [ "$SOURCE_TYPE" != "aurora-cluster" ] && [ "$SOURCE_TYPE" != "rds-instance" ]; then
            echo "ERROR: Invalid source_type: $SOURCE_TYPE"
            echo "Supported values: aurora-cluster, rds-instance"
            exit 1
          fi

          # Validate TTL <= 48 hours
          if [ "$TTL_HOURS" -gt 48 ]; then
            echo "ERROR: TTL cannot exceed 48 hours. Got: $TTL_HOURS"
            exit 1
          fi

          if [ "$TTL_HOURS" -lt 1 ]; then
            echo "ERROR: TTL must be at least 1 hour. Got: $TTL_HOURS"
            exit 1
          fi

          # Validate region format (e.g., us-east-1, ca-central-1)
          if ! echo "$REGION" | grep -qE '^[a-z]{2}-[a-z]+-[0-9]+$'; then
            echo "ERROR: Invalid region format: $REGION"
            exit 1
          fi

          # Validate source_db format
          if ! echo "$SOURCE_DB" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9\-]+$'; then
            echo "ERROR: Invalid source_db format: $SOURCE_DB"
            exit 1
          fi

          echo "All validations passed"

      # -------------------------------------------
      # 3. Generate Clone Name
      # -------------------------------------------
      - name: Generate Clone Name
        id: clone_name
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SOURCE_DB="${{ steps.config.outputs.source_db }}"
          CLONE_NAME="${SOURCE_DB}-clone-${TIMESTAMP}"
          INSTANCE_NAME="${CLONE_NAME}-0"
          SNAPSHOT_NAME="${SOURCE_DB}-snapshot-${TIMESTAMP}"

          # Length validation (AWS limit is 63 characters)
          if [ ${#CLONE_NAME} -gt 63 ]; then
            echo "ERROR: Clone name is too long (${#CLONE_NAME} chars, max 63): $CLONE_NAME"
            exit 1
          fi

          if [ ${#INSTANCE_NAME} -gt 63 ]; then
            echo "ERROR: Instance name is too long (${#INSTANCE_NAME} chars, max 63): $INSTANCE_NAME"
            exit 1
          fi

          echo "clone_name=$CLONE_NAME" >> $GITHUB_OUTPUT
          echo "instance_name=$INSTANCE_NAME" >> $GITHUB_OUTPUT
          echo "snapshot_name=$SNAPSHOT_NAME" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          echo "Generated Clone Name: $CLONE_NAME"
          echo "Instance Name: $INSTANCE_NAME"

      # -------------------------------------------
      # 4. Calculate Expiry
      # -------------------------------------------
      - name: Calculate Expiry
        id: expiry
        run: |
          TTL_HOURS="${{ steps.config.outputs.ttl_hours }}"
          EXPIRY=$(date -u -d "+${TTL_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          echo "expiry=$EXPIRY" >> $GITHUB_OUTPUT
          echo "Clone will expire at: $EXPIRY"

      # -------------------------------------------
      # 5. Configure AWS Credentials
      # -------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.region }}

      # -------------------------------------------
      # 6. Validate Source DB Exists
      # -------------------------------------------
      - name: Validate Source DB Exists
        id: source_info
        run: |
          REGION="${{ steps.config.outputs.region }}"
          SOURCE_DB="${{ steps.config.outputs.source_db }}"
          SOURCE_TYPE="${{ steps.config.outputs.source_type }}"

          echo "Checking source DB exists: $SOURCE_DB in $REGION (type: $SOURCE_TYPE)"

          if [ "$SOURCE_TYPE" = "aurora-cluster" ]; then
            EXISTS=$(aws rds describe-db-clusters \
              --region "$REGION" \
              --db-cluster-identifier "$SOURCE_DB" \
              --query "DBClusters[0].DBClusterIdentifier" \
              --output text 2>/dev/null || echo "NOT_FOUND")

            if [ "$EXISTS" = "NOT_FOUND" ] || [ "$EXISTS" = "None" ]; then
              echo "ERROR: Aurora cluster '$SOURCE_DB' does not exist in region '$REGION'"
              exit 1
            fi

            # Detect engine
            ENGINE=$(aws rds describe-db-clusters \
              --region "$REGION" \
              --db-cluster-identifier "$SOURCE_DB" \
              --query "DBClusters[0].Engine" \
              --output text)

          elif [ "$SOURCE_TYPE" = "rds-instance" ]; then
            EXISTS=$(aws rds describe-db-instances \
              --region "$REGION" \
              --db-instance-identifier "$SOURCE_DB" \
              --query "DBInstances[0].DBInstanceIdentifier" \
              --output text 2>/dev/null || echo "NOT_FOUND")

            if [ "$EXISTS" = "NOT_FOUND" ] || [ "$EXISTS" = "None" ]; then
              echo "ERROR: RDS instance '$SOURCE_DB' does not exist in region '$REGION'"
              exit 1
            fi

            # Detect engine
            ENGINE=$(aws rds describe-db-instances \
              --region "$REGION" \
              --db-instance-identifier "$SOURCE_DB" \
              --query "DBInstances[0].Engine" \
              --output text)
          fi

          echo "engine=$ENGINE" >> $GITHUB_OUTPUT
          echo "Source DB exists. Engine: $ENGINE"

      # -------------------------------------------
      # 7. Validate Engine
      # -------------------------------------------
      - name: Validate Engine
        run: |
          ENGINE="${{ steps.source_info.outputs.engine }}"

          case "$ENGINE" in
            aurora-mysql|aurora-postgresql|mysql|postgres)
              echo "Supported engine: $ENGINE"
              ;;
            *)
              echo "ERROR: Unsupported engine: $ENGINE"
              echo "Supported engines: aurora-mysql, aurora-postgresql, mysql, postgres"
              exit 1
              ;;
          esac

      # -------------------------------------------
      # 8. Prevent Duplicate Clone for PR
      # -------------------------------------------
      - name: Prevent Duplicate Clone for PR
        run: |
          REGION="${{ steps.config.outputs.region }}"
          SOURCE_TYPE="${{ steps.config.outputs.source_type }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "Checking for existing clone for PR #$PR_NUMBER"

          if [ "$SOURCE_TYPE" = "aurora-cluster" ]; then
            CLUSTERS=$(aws rds describe-db-clusters \
              --region "$REGION" \
              --query "DBClusters[?contains(DBClusterIdentifier, 'clone')].{Id:DBClusterIdentifier,Arn:DBClusterArn}" \
              --output json)

            MATCH=$(echo "$CLUSTERS" | jq -r --arg PR "$PR_NUMBER" '.[] | .Arn + " " + .Id' | while read -r ARN ID; do
              TAG_PR=$(aws rds list-tags-for-resource \
                --region "$REGION" \
                --resource-name "$ARN" \
                --query "TagList[?Key=='PR'].Value" \
                --output text)
              if [ "$TAG_PR" = "$PR_NUMBER" ]; then
                echo "$ID"
                break
              fi
            done)
          else
            INSTANCES=$(aws rds describe-db-instances \
              --region "$REGION" \
              --query "DBInstances[?contains(DBInstanceIdentifier, 'clone')].{Id:DBInstanceIdentifier,Arn:DBInstanceArn}" \
              --output json)

            MATCH=$(echo "$INSTANCES" | jq -r --arg PR "$PR_NUMBER" '.[] | .Arn + " " + .Id' | while read -r ARN ID; do
              TAG_PR=$(aws rds list-tags-for-resource \
                --region "$REGION" \
                --resource-name "$ARN" \
                --query "TagList[?Key=='PR'].Value" \
                --output text)
              if [ "$TAG_PR" = "$PR_NUMBER" ]; then
                echo "$ID"
                break
              fi
            done)
          fi

          if [ -n "$MATCH" ]; then
            echo "ERROR: A clone already exists for this PR: $MATCH"
            exit 1
          fi

          echo "No existing clone found for this PR."

      # -------------------------------------------
      # 9. Create Clone (branching by source_type)
      # -------------------------------------------
      - name: Create Clone - Aurora Cluster
        if: steps.config.outputs.source_type == 'aurora-cluster'
        run: |
          REGION="${{ steps.config.outputs.region }}"
          SOURCE_DB="${{ steps.config.outputs.source_db }}"
          CLONE_NAME="${{ steps.clone_name.outputs.clone_name }}"
          INSTANCE_NAME="${{ steps.clone_name.outputs.instance_name }}"
          INSTANCE_CLASS="${{ steps.config.outputs.instance_class }}"
          ENGINE="${{ steps.source_info.outputs.engine }}"
          EXPIRY="${{ steps.expiry.outputs.expiry }}"

          echo "Creating Aurora cluster clone: $CLONE_NAME"
          echo "   Source: $SOURCE_DB"
          echo "   Engine: $ENGINE"
          echo "   Region: $REGION"

          # Create cluster clone (copy-on-write)
          aws rds restore-db-cluster-to-point-in-time \
            --region "$REGION" \
            --source-db-cluster-identifier "$SOURCE_DB" \
            --db-cluster-identifier "$CLONE_NAME" \
            --restore-type copy-on-write \
            --use-latest-restorable-time \
            --tags \
              Key=Platform,Value=developer-tools \
              Key=Requester,Value=${{ github.actor }} \
              Key=PR,Value=${{ github.event.pull_request.number }} \
              Key=Expiry,Value="$EXPIRY" \
              Key=SourceDB,Value="$SOURCE_DB" \
              Key=SourceType,Value=aurora-cluster \
              Key=ManagedBy,Value=db-clone-system

          echo "Waiting for cluster to become available..."
          aws rds wait db-cluster-available \
            --region "$REGION" \
            --db-cluster-identifier "$CLONE_NAME"
          echo "Cluster is available"

          # Create instance in the cloned cluster
          echo "Creating instance: $INSTANCE_NAME (class: $INSTANCE_CLASS)"
          aws rds create-db-instance \
            --region "$REGION" \
            --db-instance-identifier "$INSTANCE_NAME" \
            --db-cluster-identifier "$CLONE_NAME" \
            --db-instance-class "$INSTANCE_CLASS" \
            --engine "$ENGINE" \
            --tags \
              Key=Platform,Value=developer-tools \
              Key=Requester,Value=${{ github.actor }} \
              Key=PR,Value=${{ github.event.pull_request.number }} \
              Key=Expiry,Value="$EXPIRY" \
              Key=ManagedBy,Value=db-clone-system

          echo "Waiting for instance to become available..."
          aws rds wait db-instance-available \
            --region "$REGION" \
            --db-instance-identifier "$INSTANCE_NAME"
          echo "Instance is available"

      - name: Create Clone - RDS Instance (via Snapshot)
        if: steps.config.outputs.source_type == 'rds-instance'
        run: |
          REGION="${{ steps.config.outputs.region }}"
          SOURCE_DB="${{ steps.config.outputs.source_db }}"
          CLONE_NAME="${{ steps.clone_name.outputs.clone_name }}"
          SNAPSHOT_NAME="${{ steps.clone_name.outputs.snapshot_name }}"
          INSTANCE_CLASS="${{ steps.config.outputs.instance_class }}"
          EXPIRY="${{ steps.expiry.outputs.expiry }}"

          echo "Creating RDS instance clone via snapshot: $CLONE_NAME"
          echo "   Source: $SOURCE_DB"
          echo "   Region: $REGION"

          # Create snapshot of source
          echo "Creating snapshot: $SNAPSHOT_NAME"
          aws rds create-db-snapshot \
            --region "$REGION" \
            --db-instance-identifier "$SOURCE_DB" \
            --db-snapshot-identifier "$SNAPSHOT_NAME" \
            --tags \
              Key=Platform,Value=developer-tools \
              Key=ManagedBy,Value=db-clone-system \
              Key=Requester,Value=${{ github.actor }} \
              Key=PR,Value=${{ github.event.pull_request.number }} \
              Key=Expiry,Value="$EXPIRY" \
              Key=SourceDB,Value="$SOURCE_DB"

          echo "Waiting for snapshot to become available..."
          aws rds wait db-snapshot-available \
            --region "$REGION" \
            --db-snapshot-identifier "$SNAPSHOT_NAME"
          echo "Snapshot ready"

          # Restore instance from snapshot
          echo "Restoring instance from snapshot: $CLONE_NAME"
          aws rds restore-db-instance-from-db-snapshot \
            --region "$REGION" \
            --db-instance-identifier "$CLONE_NAME" \
            --db-snapshot-identifier "$SNAPSHOT_NAME" \
            --db-instance-class "$INSTANCE_CLASS" \
            --tags \
              Key=Platform,Value=developer-tools \
              Key=Requester,Value=${{ github.actor }} \
              Key=PR,Value=${{ github.event.pull_request.number }} \
              Key=Expiry,Value="$EXPIRY" \
              Key=SourceDB,Value="$SOURCE_DB" \
              Key=SourceType,Value=rds-instance \
              Key=SnapshotId,Value="$SNAPSHOT_NAME" \
              Key=ManagedBy,Value=db-clone-system

          echo "Waiting for instance to become available..."
          aws rds wait db-instance-available \
            --region "$REGION" \
            --db-instance-identifier "$CLONE_NAME"
          echo "Instance is available"

      # -------------------------------------------
      # 9a. Partial Failure Cleanup - Aurora
      # -------------------------------------------
      - name: Cleanup on Failure - Aurora Cluster
        if: failure() && steps.config.outputs.source_type == 'aurora-cluster'
        run: |
          REGION="${{ steps.config.outputs.region }}"
          CLONE_NAME="${{ steps.clone_name.outputs.clone_name }}"
          INSTANCE_NAME="${{ steps.clone_name.outputs.instance_name }}"

          echo "Partial failure detected. Cleaning up Aurora resources..."

          # Try to delete instance if it was created
          aws rds delete-db-instance \
            --region "$REGION" \
            --db-instance-identifier "$INSTANCE_NAME" \
            --skip-final-snapshot 2>/dev/null || true

          aws rds wait db-instance-deleted \
            --region "$REGION" \
            --db-instance-identifier "$INSTANCE_NAME" 2>/dev/null || true

          # Try to delete cluster if it was created
          aws rds delete-db-cluster \
            --region "$REGION" \
            --db-cluster-identifier "$CLONE_NAME" \
            --skip-final-snapshot 2>/dev/null || true

          echo "Cleanup attempted for Aurora partial failure."

      # -------------------------------------------
      # 9b. Partial Failure Cleanup - RDS Instance
      # -------------------------------------------
      - name: Cleanup on Failure - RDS Instance
        if: failure() && steps.config.outputs.source_type == 'rds-instance'
        run: |
          REGION="${{ steps.config.outputs.region }}"
          CLONE_NAME="${{ steps.clone_name.outputs.clone_name }}"
          SNAPSHOT_NAME="${{ steps.clone_name.outputs.snapshot_name }}"

          echo "Partial failure detected. Cleaning up RDS resources..."

          # Try to delete restored instance if it was created
          aws rds delete-db-instance \
            --region "$REGION" \
            --db-instance-identifier "$CLONE_NAME" \
            --skip-final-snapshot 2>/dev/null || true

          aws rds wait db-instance-deleted \
            --region "$REGION" \
            --db-instance-identifier "$CLONE_NAME" 2>/dev/null || true

          # Try to delete snapshot if it was created
          aws rds delete-db-snapshot \
            --region "$REGION" \
            --db-snapshot-identifier "$SNAPSHOT_NAME" 2>/dev/null || true

          echo "Cleanup attempted for RDS partial failure."

      # -------------------------------------------
      # 10. Fetch Endpoint
      # -------------------------------------------
      - name: Fetch Endpoint
        id: endpoint
        run: |
          REGION="${{ steps.config.outputs.region }}"
          SOURCE_TYPE="${{ steps.config.outputs.source_type }}"
          CLONE_NAME="${{ steps.clone_name.outputs.clone_name }}"

          if [ "$SOURCE_TYPE" = "aurora-cluster" ]; then
            ENDPOINT=$(aws rds describe-db-clusters \
              --region "$REGION" \
              --db-cluster-identifier "$CLONE_NAME" \
              --query 'DBClusters[0].Endpoint' \
              --output text)

            PORT=$(aws rds describe-db-clusters \
              --region "$REGION" \
              --db-cluster-identifier "$CLONE_NAME" \
              --query 'DBClusters[0].Port' \
              --output text)
          else
            ENDPOINT=$(aws rds describe-db-instances \
              --region "$REGION" \
              --db-instance-identifier "$CLONE_NAME" \
              --query 'DBInstances[0].Endpoint.Address' \
              --output text)

            PORT=$(aws rds describe-db-instances \
              --region "$REGION" \
              --db-instance-identifier "$CLONE_NAME" \
              --query 'DBInstances[0].Endpoint.Port' \
              --output text)
          fi

          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT
          echo "port=$PORT" >> $GITHUB_OUTPUT

          echo "Endpoint: $ENDPOINT:$PORT"

      # -------------------------------------------
      # 11. Notify - PR Comment
      # -------------------------------------------
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const cloneName = '${{ steps.clone_name.outputs.clone_name }}';
            const endpoint = '${{ steps.endpoint.outputs.endpoint }}';
            const port = '${{ steps.endpoint.outputs.port }}';
            const ttl = '${{ steps.config.outputs.ttl_hours }}';
            const expiry = '${{ steps.expiry.outputs.expiry }}';
            const region = '${{ steps.config.outputs.region }}';
            const sourceDb = '${{ steps.config.outputs.source_db }}';
            const sourceType = '${{ steps.config.outputs.source_type }}';
            const engine = '${{ steps.source_info.outputs.engine }}';

            const body = `## DB Clone Ready

            | Property | Value |
            |----------|-------|
            | **Clone** | \`${cloneName}\` |
            | **Endpoint** | \`${endpoint}:${port}\` |
            | **Source** | \`${sourceDb}\` |
            | **Source Type** | \`${sourceType}\` |
            | **Engine** | \`${engine}\` |
            | **Region** | \`${region}\` |
            | **TTL** | ${ttl} hours |
            | **Expires** | ${expiry} |
            | **Requester** | @${{ github.actor }} |

            ### Connection

            Use the appropriate client for the engine:

            **mysql / aurora-mysql:**
            \`\`\`
            mysql -h ${endpoint} -P ${port} -u <username> -p
            \`\`\`

            **postgres / aurora-postgresql:**
            \`\`\`
            psql -h ${endpoint} -p ${port} -U <username> -d <dbname>
            \`\`\`

            ### Notes
            - This clone will be **automatically destroyed** when this PR is closed or TTL expires.
            - To extend TTL, run the **DB Clone - Extend** workflow.
            - To destroy manually, run the **DB Clone - Destroy** workflow.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      # -------------------------------------------
      # 12. Notify - Slack
      # -------------------------------------------
      - name: Notify Slack
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "Slack webhook not configured. Skipping notification."
            exit 0
          fi

          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d '{
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "DB Clone Created"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*User:* ${{ github.actor }}"},
                    {"type": "mrkdwn", "text": "*Clone:* `${{ steps.clone_name.outputs.clone_name }}`"},
                    {"type": "mrkdwn", "text": "*Endpoint:* `${{ steps.endpoint.outputs.endpoint }}`"},
                    {"type": "mrkdwn", "text": "*Source Type:* ${{ steps.config.outputs.source_type }}"},
                    {"type": "mrkdwn", "text": "*TTL:* ${{ steps.config.outputs.ttl_hours }}h"},
                    {"type": "mrkdwn", "text": "*Region:* ${{ steps.config.outputs.region }}"}
                  ]
                }
              ]
            }'

      # -------------------------------------------
      # 13. Failure Comment
      # -------------------------------------------
      - name: Comment on PR - Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## DB Clone Failed

            Possible causes:
            - Source DB does not exist in the specified region
            - Unsupported engine (supported: aurora-mysql, aurora-postgresql, mysql, postgres)
            - Invalid source_type (supported: aurora-cluster, rds-instance)
            - Duplicate clone already exists for this PR
            - AWS IAM permissions issue
            - KMS key access denied (for encrypted databases)

            Please check workflow logs or contact SRE.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
