# =============================================================
# DB Clone - Extend TTL
# =============================================================
# Manually triggered to extend the TTL of an existing clone.
# Supports both Aurora clusters and RDS instances.
# Updates the Expiry tag with a new timestamp.
# =============================================================

name: "DB Clone - Extend"

on:
  workflow_dispatch:
    inputs:
      clone_name:
        description: "Clone name (cluster or instance)"
        required: true
        type: string
      region:
        description: "AWS Region"
        required: true
        default: "ca-central-1"
        type: string
      source_type:
        description: "Source type"
        required: true
        default: "aurora-cluster"
        type: choice
        options:
          - aurora-cluster
          - rds-instance
      extend_hours:
        description: "Hours to extend (max 48 from now)"
        required: true
        default: "24"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  extend-ttl:
    runs-on: ubuntu-latest
    environment: db-approval

    steps:
      - name: Validate Inputs
        run: |
          CLONE="${{ inputs.clone_name }}"
          EXTEND_HOURS="${{ inputs.extend_hours }}"

          # Must contain -clone-
          if [[ "$CLONE" != *"-clone-"* ]]; then
            echo "ERROR: Name must contain '-clone-'"
            exit 1
          fi

          # Validate extend hours
          if [ "$EXTEND_HOURS" -gt 48 ]; then
            echo "ERROR: Cannot extend more than 48 hours from now. Got: $EXTEND_HOURS"
            exit 1
          fi

          if [ "$EXTEND_HOURS" -lt 1 ]; then
            echo "ERROR: Extension must be at least 1 hour. Got: $EXTEND_HOURS"
            exit 1
          fi

          echo "Inputs validated"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Verify Clone Exists and Validate Tags
        id: verify
        run: |
          CLONE="${{ inputs.clone_name }}"
          REGION="${{ inputs.region }}"
          SOURCE_TYPE="${{ inputs.source_type }}"

          # Get ARN based on source type
          if [ "$SOURCE_TYPE" = "aurora-cluster" ]; then
            RESOURCE_ARN=$(aws rds describe-db-clusters \
              --region "$REGION" \
              --db-cluster-identifier "$CLONE" \
              --query 'DBClusters[0].DBClusterArn' \
              --output text 2>/dev/null)
          else
            RESOURCE_ARN=$(aws rds describe-db-instances \
              --region "$REGION" \
              --db-instance-identifier "$CLONE" \
              --query 'DBInstances[0].DBInstanceArn' \
              --output text 2>/dev/null)
          fi

          if [ -z "$RESOURCE_ARN" ] || [ "$RESOURCE_ARN" = "None" ]; then
            echo "ERROR: Clone not found: $CLONE (type: $SOURCE_TYPE)"
            exit 1
          fi

          echo "resource_arn=$RESOURCE_ARN" >> $GITHUB_OUTPUT
          echo "Clone found: $CLONE"

          # Check Platform tag
          PLATFORM_TAG=$(aws rds list-tags-for-resource \
            --region "$REGION" \
            --resource-name "$RESOURCE_ARN" \
            --query "TagList[?Key=='Platform'].Value" \
            --output text)

          if [ "$PLATFORM_TAG" != "developer-tools" ]; then
            echo "ERROR: Missing Platform=developer-tools tag. Cannot extend."
            exit 1
          fi

          # Check ManagedBy tag
          MANAGED_BY=$(aws rds list-tags-for-resource \
            --region "$REGION" \
            --resource-name "$RESOURCE_ARN" \
            --query "TagList[?Key=='ManagedBy'].Value" \
            --output text)

          if [ "$MANAGED_BY" != "db-clone-system" ]; then
            echo "ERROR: Missing ManagedBy=db-clone-system tag. Cannot extend."
            exit 1
          fi

          # Check Expiry tag exists
          EXPIRY_TAG=$(aws rds list-tags-for-resource \
            --region "$REGION" \
            --resource-name "$RESOURCE_ARN" \
            --query "TagList[?Key=='Expiry'].Value" \
            --output text)

          if [ -z "$EXPIRY_TAG" ] || [ "$EXPIRY_TAG" = "None" ]; then
            echo "ERROR: Missing Expiry tag. Cannot extend."
            exit 1
          fi

          # Check Requester
          REQUESTER_TAG=$(aws rds list-tags-for-resource \
            --region "$REGION" \
            --resource-name "$RESOURCE_ARN" \
            --query "TagList[?Key=='Requester'].Value" \
            --output text)

          if [ "$REQUESTER_TAG" != "${{ github.actor }}" ]; then
            echo "WARNING: You (${{ github.actor }}) are not the original requester ($REQUESTER_TAG)"
            echo "   Proceeding anyway, but only the requester should normally extend."
          fi

          echo "All tag validations passed"
          echo "   Platform: $PLATFORM_TAG"
          echo "   ManagedBy: $MANAGED_BY"
          echo "   Expiry: $EXPIRY_TAG"
          echo "   Requester: $REQUESTER_TAG"

      - name: Update Expiry Tag
        run: |
          CLONE="${{ inputs.clone_name }}"
          REGION="${{ inputs.region }}"
          SOURCE_TYPE="${{ inputs.source_type }}"
          EXTEND_HOURS="${{ inputs.extend_hours }}"
          RESOURCE_ARN="${{ steps.verify.outputs.resource_arn }}"

          # Calculate new expiry
          NEW_EXPIRY=$(date -u -d "+${EXTEND_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)

          echo "Updating Expiry tag..."
          echo "   New Expiry: $NEW_EXPIRY"

          # Update main resource
          aws rds add-tags-to-resource \
            --region "$REGION" \
            --resource-name "$RESOURCE_ARN" \
            --tags Key=Expiry,Value="$NEW_EXPIRY"

          # For Aurora clusters, also update instances
          if [ "$SOURCE_TYPE" = "aurora-cluster" ]; then
            INSTANCES=$(aws rds describe-db-instances \
              --region "$REGION" \
              --filters "Name=db-cluster-id,Values=$CLONE" \
              --query 'DBInstances[].DBInstanceArn' \
              --output text)

            for INSTANCE_ARN in $INSTANCES; do
              aws rds add-tags-to-resource \
                --region "$REGION" \
                --resource-name "$INSTANCE_ARN" \
                --tags Key=Expiry,Value="$NEW_EXPIRY"
            done
          fi

          echo "TTL Extended"
          echo "   Clone: $CLONE"
          echo "   Type: $SOURCE_TYPE"
          echo "   New Expiry: $NEW_EXPIRY"
          echo "   Extended by: ${{ github.actor }}"
