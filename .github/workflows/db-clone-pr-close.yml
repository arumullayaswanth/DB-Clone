# =============================================================
# DB Clone - PR Close (Auto Destroy)
# =============================================================
# Automatically destroys the clone when the PR is closed/merged.
# Uses region matrix to scan for clones by PR tag.
# Does NOT depend on config.yaml (branch may be deleted).
# =============================================================

name: "DB Clone - PR Close"

on:
  pull_request:
    types: [closed]
    paths:
      - "db-clone/config.yaml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  auto-destroy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: [us-east-1, ca-central-1]

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - name: Find Clone by PR Tag
        id: find_clone
        run: |
          REGION="${{ matrix.region }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "Searching for clones tagged with PR=$PR_NUMBER in $REGION..."

          CLUSTERS=$(aws rds describe-db-clusters \
            --region "$REGION" \
            --query "DBClusters[?contains(DBClusterIdentifier, 'clone')].{Id:DBClusterIdentifier,Arn:DBClusterArn}" \
            --output json)

          CLONE_FOUND=""
          echo "$CLUSTERS" | jq -c '.[]' | while read -r CLUSTER_JSON; do
            CLUSTER_ID=$(echo "$CLUSTER_JSON" | jq -r '.Id')
            CLUSTER_ARN=$(echo "$CLUSTER_JSON" | jq -r '.Arn')

            # Validate Platform tag
            PLATFORM_TAG=$(aws rds list-tags-for-resource \
              --region "$REGION" \
              --resource-name "$CLUSTER_ARN" \
              --query "TagList[?Key=='Platform'].Value" \
              --output text)

            if [ "$PLATFORM_TAG" != "developer-tools" ]; then
              continue
            fi

            # Validate ManagedBy tag
            MANAGED_BY=$(aws rds list-tags-for-resource \
              --region "$REGION" \
              --resource-name "$CLUSTER_ARN" \
              --query "TagList[?Key=='ManagedBy'].Value" \
              --output text)

            if [ "$MANAGED_BY" != "db-clone-system" ]; then
              continue
            fi

            # Check PR tag
            PR_TAG=$(aws rds list-tags-for-resource \
              --region "$REGION" \
              --resource-name "$CLUSTER_ARN" \
              --query "TagList[?Key=='PR'].Value" \
              --output text)

            if [ "$PR_TAG" = "$PR_NUMBER" ]; then
              echo "$CLUSTER_ID" > /tmp/clone_found.txt
              break
            fi
          done

          if [ -f /tmp/clone_found.txt ]; then
            CLONE_FOUND=$(cat /tmp/clone_found.txt)
            echo "Found clone: $CLONE_FOUND"
            echo "clone_name=$CLONE_FOUND" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "No clone found for PR #$PR_NUMBER in $REGION."
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete DB Instances
        if: steps.find_clone.outputs.found == 'true'
        run: |
          CLUSTER="${{ steps.find_clone.outputs.clone_name }}"
          REGION="${{ matrix.region }}"

          echo "Deleting instances for cluster: $CLUSTER"

          INSTANCES=$(aws rds describe-db-instances \
            --region "$REGION" \
            --filters "Name=db-cluster-id,Values=$CLUSTER" \
            --query 'DBInstances[].DBInstanceIdentifier' \
            --output text)

          for INSTANCE in $INSTANCES; do
            echo "   Deleting: $INSTANCE"
            aws rds delete-db-instance \
              --region "$REGION" \
              --db-instance-identifier "$INSTANCE" \
              --skip-final-snapshot
          done

          for INSTANCE in $INSTANCES; do
            echo "   Waiting: $INSTANCE"
            aws rds wait db-instance-deleted \
              --region "$REGION" \
              --db-instance-identifier "$INSTANCE" || true
          done

          echo "Instances deleted"

      - name: Delete DB Cluster
        if: steps.find_clone.outputs.found == 'true'
        run: |
          CLUSTER="${{ steps.find_clone.outputs.clone_name }}"
          REGION="${{ matrix.region }}"

          echo "Deleting cluster: $CLUSTER"

          aws rds delete-db-cluster \
            --region "$REGION" \
            --db-cluster-identifier "$CLUSTER" \
            --skip-final-snapshot

          aws rds wait db-cluster-deleted \
            --region "$REGION" \
            --db-cluster-identifier "$CLUSTER" || true

          echo "Cluster deleted"

      - name: Comment on PR
        if: steps.find_clone.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const cloneName = '${{ steps.find_clone.outputs.clone_name }}';
            const region = '${{ matrix.region }}';
            const body = `## DB Clone Destroyed

            | Property | Value |
            |----------|-------|
            | **Cluster** | \`${cloneName}\` |
            | **Region** | \`${region}\` |
            | **Reason** | PR closed |
            | **Destroyed at** | ${new Date().toISOString()} |

            The clone has been automatically cleaned up.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
