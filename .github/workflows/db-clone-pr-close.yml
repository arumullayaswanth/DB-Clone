# =============================================================
# DB Clone - PR Close (Auto Destroy)
# =============================================================
# Automatically destroys the clone when the PR is closed/merged.
# Keeps the environment clean without manual intervention.
# =============================================================

name: "DB Clone - PR Close"

on:
  pull_request:
    types: [closed]
    paths:
      - "db-clone/config.yaml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  auto-destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Config
        id: config
        run: |
          CONFIG_FILE="db-clone/config.yaml"
          REGION=$(grep '^region:' "$CONFIG_FILE" | awk '{print $2}')
          echo "region=$REGION" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Find Clone by PR Tag
        id: find_clone
        run: |
          REGION="${{ steps.config.outputs.region }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "Searching for clones tagged with PR=$PR_NUMBER..."

          # Find clusters with matching PR tag
          CLUSTERS=$(aws rds describe-db-clusters \
            --region "$REGION" \
            --query "DBClusters[?contains(DBClusterIdentifier, 'clone')].DBClusterIdentifier" \
            --output text)

          CLONE_FOUND=""
          for CLUSTER in $CLUSTERS; do
            CLUSTER_ARN=$(aws rds describe-db-clusters \
              --region "$REGION" \
              --db-cluster-identifier "$CLUSTER" \
              --query 'DBClusters[0].DBClusterArn' \
              --output text)

            PR_TAG=$(aws rds list-tags-for-resource \
              --region "$REGION" \
              --resource-name "$CLUSTER_ARN" \
              --query "TagList[?Key=='PR'].Value" \
              --output text)

            if [ "$PR_TAG" = "$PR_NUMBER" ]; then
              CLONE_FOUND="$CLUSTER"
              echo "Found clone: $CLUSTER"
              break
            fi
          done

          if [ -z "$CLONE_FOUND" ]; then
            echo "No clone found for PR #$PR_NUMBER. May have been already destroyed."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "clone_name=$CLONE_FOUND" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: Delete DB Instances
        if: steps.find_clone.outputs.found == 'true'
        run: |
          CLUSTER="${{ steps.find_clone.outputs.clone_name }}"
          REGION="${{ steps.config.outputs.region }}"

          echo "Deleting instances for cluster: $CLUSTER"

          INSTANCES=$(aws rds describe-db-instances \
            --region "$REGION" \
            --filters "Name=db-cluster-id,Values=$CLUSTER" \
            --query 'DBInstances[].DBInstanceIdentifier' \
            --output text)

          for INSTANCE in $INSTANCES; do
            echo "   Deleting: $INSTANCE"
            aws rds delete-db-instance \
              --region "$REGION" \
              --db-instance-identifier "$INSTANCE" \
              --skip-final-snapshot
          done

          for INSTANCE in $INSTANCES; do
            echo "   Waiting: $INSTANCE"
            aws rds wait db-instance-deleted \
              --region "$REGION" \
              --db-instance-identifier "$INSTANCE" || true
          done

          echo "Instances deleted"

      - name: Delete DB Cluster
        if: steps.find_clone.outputs.found == 'true'
        run: |
          CLUSTER="${{ steps.find_clone.outputs.clone_name }}"
          REGION="${{ steps.config.outputs.region }}"

          echo "Deleting cluster: $CLUSTER"

          aws rds delete-db-cluster \
            --region "$REGION" \
            --db-cluster-identifier "$CLUSTER" \
            --skip-final-snapshot

          aws rds wait db-cluster-deleted \
            --region "$REGION" \
            --db-cluster-identifier "$CLUSTER" || true

          echo "Cluster deleted"

      - name: Comment on PR
        if: steps.find_clone.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const cloneName = '${{ steps.find_clone.outputs.clone_name }}';
            const body = `## DB Clone Destroyed

            | Property | Value |
            |----------|-------|
            | **Cluster** | \`${cloneName}\` |
            | **Reason** | PR closed |
            | **Destroyed at** | ${new Date().toISOString()} |

            The clone has been automatically cleaned up.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
