# =============================================================
# DB Clone - TTL Cleanup (Scheduled)
# =============================================================
# Runs on a schedule to find and destroy expired clones.
# Scans both Aurora clusters and RDS instances.
# Checks the Expiry tag against current time.
# =============================================================

name: "DB Clone - TTL Cleanup"

on:
  schedule:
    # Run every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: read
  id-token: write

jobs:
  cleanup-expired:
    runs-on: ubuntu-latest
    environment: db-approval
    strategy:
      matrix:
        region: [us-east-1, us-west-2, eu-west-1, ca-central-1]

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ matrix.region }}

      - name: Find and Destroy Expired Clones
        id: cleanup
        run: |
          REGION="${{ matrix.region }}"
          CURRENT_TIME=$(date -u +%s)
          DELETED_COUNT=0

          echo "Scanning for expired clones in $REGION..."
          echo "   Current time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # -------------------------------------------
          # SCAN AURORA CLUSTERS
          # -------------------------------------------
          echo ""
          echo "=== Scanning Aurora Clusters ==="

          CLUSTERS=$(aws rds describe-db-clusters \
            --region "$REGION" \
            --query "DBClusters[?contains(DBClusterIdentifier, 'clone')].{Id:DBClusterIdentifier,Arn:DBClusterArn}" \
            --output json)

          while read -r CLUSTER_JSON; do
            [ -z "$CLUSTER_JSON" ] && continue
            CLUSTER_ID=$(echo "$CLUSTER_JSON" | jq -r '.Id')
            CLUSTER_ARN=$(echo "$CLUSTER_JSON" | jq -r '.Arn')

            # Check if managed by our system
            PLATFORM_TAG=$(aws rds list-tags-for-resource \
              --region "$REGION" \
              --resource-name "$CLUSTER_ARN" \
              --query "TagList[?Key=='Platform'].Value" \
              --output text)

            if [ "$PLATFORM_TAG" != "developer-tools" ]; then
              continue
            fi

            MANAGED_BY=$(aws rds list-tags-for-resource \
              --region "$REGION" \
              --resource-name "$CLUSTER_ARN" \
              --query "TagList[?Key=='ManagedBy'].Value" \
              --output text)

            if [ "$MANAGED_BY" != "db-clone-system" ]; then
              continue
            fi

            # Get expiry
            EXPIRY_TAG=$(aws rds list-tags-for-resource \
              --region "$REGION" \
              --resource-name "$CLUSTER_ARN" \
              --query "TagList[?Key=='Expiry'].Value" \
              --output text)

            if [ -z "$EXPIRY_TAG" ] || [ "$EXPIRY_TAG" = "None" ]; then
              echo "   WARNING: $CLUSTER_ID: No Expiry tag, skipping"
              continue
            fi

            EXPIRY_EPOCH=$(date -u -d "$EXPIRY_TAG" +%s 2>/dev/null)
            if [ -z "$EXPIRY_EPOCH" ]; then
              echo "   WARNING: $CLUSTER_ID: Invalid Expiry format: $EXPIRY_TAG"
              continue
            fi

            if [ "$CURRENT_TIME" -gt "$EXPIRY_EPOCH" ]; then
              echo "   EXPIRED [cluster]: $CLUSTER_ID (expired at $EXPIRY_TAG)"
              echo "   Destroying..."

              INSTANCES=$(aws rds describe-db-instances \
                --region "$REGION" \
                --filters "Name=db-cluster-id,Values=$CLUSTER_ID" \
                --query 'DBInstances[].DBInstanceIdentifier' \
                --output text)

              for INSTANCE in $INSTANCES; do
                echo "      Deleting instance: $INSTANCE"
                aws rds delete-db-instance \
                  --region "$REGION" \
                  --db-instance-identifier "$INSTANCE" \
                  --skip-final-snapshot || true
              done

              for INSTANCE in $INSTANCES; do
                aws rds wait db-instance-deleted \
                  --region "$REGION" \
                  --db-instance-identifier "$INSTANCE" 2>/dev/null || true
              done

              echo "      Deleting cluster: $CLUSTER_ID"
              aws rds delete-db-cluster \
                --region "$REGION" \
                --db-cluster-identifier "$CLUSTER_ID" \
                --skip-final-snapshot || true

              echo "   Destroyed: $CLUSTER_ID"
              DELETED_COUNT=$((DELETED_COUNT + 1))
            else
              REMAINING=$(( (EXPIRY_EPOCH - CURRENT_TIME) / 3600 ))
              echo "   ACTIVE [cluster]: $CLUSTER_ID (${REMAINING}h remaining)"
            fi
          done < <(echo "$CLUSTERS" | jq -c '.[]')

          # -------------------------------------------
          # SCAN RDS INSTANCES
          # -------------------------------------------
          echo ""
          echo "=== Scanning RDS Instances ==="

          RDS_INSTANCES=$(aws rds describe-db-instances \
            --region "$REGION" \
            --query "DBInstances[?contains(DBInstanceIdentifier, 'clone')].{Id:DBInstanceIdentifier,Arn:DBInstanceArn}" \
            --output json)

          while read -r INSTANCE_JSON; do
            [ -z "$INSTANCE_JSON" ] && continue
            INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.Id')
            INSTANCE_ARN=$(echo "$INSTANCE_JSON" | jq -r '.Arn')

            # Skip instances that belong to a cluster (handled above)
            CLUSTER_ID=$(aws rds describe-db-instances \
              --region "$REGION" \
              --db-instance-identifier "$INSTANCE_ID" \
              --query 'DBInstances[0].DBClusterIdentifier' \
              --output text 2>/dev/null)

            if [ -n "$CLUSTER_ID" ] && [ "$CLUSTER_ID" != "None" ]; then
              continue
            fi

            # Check if managed by our system
            PLATFORM_TAG=$(aws rds list-tags-for-resource \
              --region "$REGION" \
              --resource-name "$INSTANCE_ARN" \
              --query "TagList[?Key=='Platform'].Value" \
              --output text)

            if [ "$PLATFORM_TAG" != "developer-tools" ]; then
              continue
            fi

            MANAGED_BY=$(aws rds list-tags-for-resource \
              --region "$REGION" \
              --resource-name "$INSTANCE_ARN" \
              --query "TagList[?Key=='ManagedBy'].Value" \
              --output text)

            if [ "$MANAGED_BY" != "db-clone-system" ]; then
              continue
            fi

            # Get expiry
            EXPIRY_TAG=$(aws rds list-tags-for-resource \
              --region "$REGION" \
              --resource-name "$INSTANCE_ARN" \
              --query "TagList[?Key=='Expiry'].Value" \
              --output text)

            if [ -z "$EXPIRY_TAG" ] || [ "$EXPIRY_TAG" = "None" ]; then
              echo "   WARNING: $INSTANCE_ID: No Expiry tag, skipping"
              continue
            fi

            EXPIRY_EPOCH=$(date -u -d "$EXPIRY_TAG" +%s 2>/dev/null)
            if [ -z "$EXPIRY_EPOCH" ]; then
              echo "   WARNING: $INSTANCE_ID: Invalid Expiry format: $EXPIRY_TAG"
              continue
            fi

            if [ "$CURRENT_TIME" -gt "$EXPIRY_EPOCH" ]; then
              echo "   EXPIRED [instance]: $INSTANCE_ID (expired at $EXPIRY_TAG)"
              echo "   Destroying..."

              # Check for snapshot to cleanup
              SNAPSHOT_ID=$(aws rds list-tags-for-resource \
                --region "$REGION" \
                --resource-name "$INSTANCE_ARN" \
                --query "TagList[?Key=='SnapshotId'].Value" \
                --output text 2>/dev/null)

              echo "      Deleting instance: $INSTANCE_ID"
              aws rds delete-db-instance \
                --region "$REGION" \
                --db-instance-identifier "$INSTANCE_ID" \
                --skip-final-snapshot || true

              aws rds wait db-instance-deleted \
                --region "$REGION" \
                --db-instance-identifier "$INSTANCE_ID" 2>/dev/null || true

              # Cleanup snapshot if exists
              if [ -n "$SNAPSHOT_ID" ] && [ "$SNAPSHOT_ID" != "None" ]; then
                echo "      Deleting snapshot: $SNAPSHOT_ID"
                aws rds delete-db-snapshot \
                  --region "$REGION" \
                  --db-snapshot-identifier "$SNAPSHOT_ID" || true
              fi

              echo "   Destroyed: $INSTANCE_ID"
              DELETED_COUNT=$((DELETED_COUNT + 1))
            else
              REMAINING=$(( (EXPIRY_EPOCH - CURRENT_TIME) / 3600 ))
              echo "   ACTIVE [instance]: $INSTANCE_ID (${REMAINING}h remaining)"
            fi
          done < <(echo "$RDS_INSTANCES" | jq -c '.[]')

          echo ""
          echo "Cleanup scan complete for $REGION. Deleted: $DELETED_COUNT"
          echo "deleted_count=$DELETED_COUNT" >> $GITHUB_OUTPUT

      - name: Notify Slack on Cleanup
        if: steps.cleanup.outputs.deleted_count != '0'
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "Slack webhook not configured. Skipping notification."
            exit 0
          fi

          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d '{
              "text": "DB Clone TTL Cleanup: Destroyed ${{ steps.cleanup.outputs.deleted_count }} expired clone(s) in region ${{ matrix.region }}"
            }' || true
